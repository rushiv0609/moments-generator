version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: moments-qdrant
    ports:
      - "127.0.0.1:6333:6333"    # REST API
      - "127.0.0.1:6334:6334"    # gRPC
    volumes:
      - ./data/qdrant_storage:/qdrant/storage:z
    environment:
      QDRANT__SERVICE__GRPC_PORT: "6334"
    deploy:
      resources:
        limits:
          memory: 2G
    restart: unless-stopped
