[project]
name = "moments-generator"
version = "0.1.0"
description = "Local AI-powered moments video generator for Apple Silicon"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sse-starlette>=2.0.0",

    # AI / ML
    "transformers>=4.45.0",
    "tokenizers>=0.20.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "mlx>=0.18.0; sys_platform == 'darwin'",

    # Image & Video Processing
    "Pillow>=10.4.0",
    "pillow-heif>=0.18.0",
    "imagehash>=4.3.1",

    # Metadata extraction
    "exifread>=3.0.0",

    # Vector Database
    "qdrant-client>=1.12.0",

    # Utilities & Settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "xxhash>=3.5.0",
    "numpy>=1.26.0",
    "python-multipart>=0.0.9",
    "psutil>=6.0.0",
    "av>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
